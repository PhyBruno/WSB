version: "3.7"

services:
  whatsapp_bridge_postgres:
    image: postgres:16-alpine
    networks:
      - network_public
    environment:
      POSTGRES_USER: whatsapp_bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whatsapp_bridge
    volumes:
      - whatsapp_bridge_postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 512M

  whatsapp_bridge_api:
    image: justbrunasso/whatsapp-bridge:latest ## Versão do whatsapp-bridge
    networks:
      - network_public
    depends_on:
      - whatsapp_bridge_postgres
    environment:
      ## Servidor
      - PORT=3000
      - JSON_BODY_LIMIT=20mb
      ## Envios com mídia (corpo grande) processados ao mesmo tempo e espera máxima na fila (depois, 503)
      - MEDIA_UPLOAD_CONCURRENCY=${MEDIA_UPLOAD_CONCURRENCY:-5}
      - MEDIA_UPLOAD_QUEUE_TIMEOUT_MS=${MEDIA_UPLOAD_QUEUE_TIMEOUT_MS:-30000}
      ## getBase64FromMediaMessage montando a resposta ao mesmo tempo
      - MEDIA_BASE64_CONCURRENCY=${MEDIA_BASE64_CONCURRENCY:-3}
      ## Banco de dados
      - DATABASE_URL=postgres://whatsapp_bridge:${POSTGRES_PASSWORD}@whatsapp_bridge_postgres:5432/whatsapp_bridge
      ## Autenticação (header x-api-key obrigatório em toda chamada)
      - API_KEY=${API_KEY}
      ## Reconexão automática após queda de conexão
      - RECONNECT_MAX_ATTEMPTS=5
      - RECONNECT_DELAY_MS=30000
      ## Watchdog de sessão travada em "connecting"
      - CONNECTING_TIMEOUT_MS=45000
      ## Timeout de confirmação de status de mensagem enviada
      - MESSAGE_STATUS_TIMEOUT_MS=8000
      ## URL pública da bridge (campo "server_url" dos webhooks; vazio = null)
      - SERVER_URL=${SERVER_URL:-}
      ## Webhooks: timeout, concorrência e polling da fila de entregas
      - WEBHOOK_TIMEOUT_MS=${WEBHOOK_TIMEOUT_MS:-10000}
      - WEBHOOK_CONCURRENCY=${WEBHOOK_CONCURRENCY:-10}
      - WEBHOOK_CONCURRENCY_PER_WEBHOOK=${WEBHOOK_CONCURRENCY_PER_WEBHOOK:-2}
      - WEBHOOK_POLL_INTERVAL_MS=${WEBHOOK_POLL_INTERVAL_MS:-1000}
      ## Webhooks: retentativa com backoff (~45 min de janela com os defaults)
      - WEBHOOK_RETRY_MAX_ATTEMPTS=${WEBHOOK_RETRY_MAX_ATTEMPTS:-15}
      - WEBHOOK_RETRY_INITIAL_DELAY_MS=${WEBHOOK_RETRY_INITIAL_DELAY_MS:-5000}
      - WEBHOOK_RETRY_MAX_DELAY_MS=${WEBHOOK_RETRY_MAX_DELAY_MS:-300000}
      ## Webhooks: mídia em base64 (teto, timeout de download e cache em memória)
      - WEBHOOK_MEDIA_MAX_BYTES=${WEBHOOK_MEDIA_MAX_BYTES:-20971520}
      - WEBHOOK_MEDIA_TIMEOUT_MS=${WEBHOOK_MEDIA_TIMEOUT_MS:-30000}
      - WEBHOOK_MEDIA_CACHE_MAX_BYTES=${WEBHOOK_MEDIA_CACHE_MAX_BYTES:-104857600}
      ## Webhooks com mídia montando/enviando ao mesmo tempo (os demais esperam a vez)
      - WEBHOOK_MEDIA_CONCURRENCY=${WEBHOOK_MEDIA_CONCURRENCY:-3}
      ## Webhooks: dias de histórico de entregas concluídas
      - WEBHOOK_DELIVERY_RETENTION_DAYS=${WEBHOOK_DELIVERY_RETENTION_DAYS:-7}
      ## Cifra dos cabeçalhos dos webhooks no banco (vazio = derivada da API_KEY)
      - WEBHOOK_HEADERS_KEY=${WEBHOOK_HEADERS_KEY:-}
      ## Histórico de mensagens: apaga as com mais de N dias (0 = guarda pra sempre)
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-0}
      ## Diagnóstico de quedas: nível dos logs do baileys e dias de wa_connection_events
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-warn}
      ## Histórico do WhatsApp ao parear: minimal (sem mensagens antigas, só mapeamentos LID), off ou recent
      - HISTORY_SYNC=${HISTORY_SYNC:-minimal}
      - CONNECTION_EVENTS_RETENTION_DAYS=${CONNECTION_EVENTS_RETENTION_DAYS:-30}
      ## Nome dos grupos (groupSubject): cache em memória, consulta ao WhatsApp e limites do histórico
      - GROUP_METADATA_TTL_MS=${GROUP_METADATA_TTL_MS:-21600000}
      - GROUP_METADATA_FAILURE_TTL_MS=${GROUP_METADATA_FAILURE_TTL_MS:-300000}
      - GROUP_METADATA_TIMEOUT_MS=${GROUP_METADATA_TIMEOUT_MS:-3000}
      - GROUP_METADATA_HISTORY_MAX_LOOKUPS=${GROUP_METADATA_HISTORY_MAX_LOOKUPS:-10}
      - GROUP_METADATA_HISTORY_BUDGET_MS=${GROUP_METADATA_HISTORY_BUDGET_MS:-5000}
      ## Memória: teto do heap do Node (deixe ~25% do limite do container pra Buffers) e diagnóstico
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-1536}
      - MEMORY_LOG_INTERVAL_MS=${MEMORY_LOG_INTERVAL_MS:-60000}
      - MEMORY_ALERT_INTERVAL_MS=${MEMORY_ALERT_INTERVAL_MS:-10000}
      - MEMORY_WARN_RATIO=${MEMORY_WARN_RATIO:-0.7}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 2048M
      labels:
        - traefik.enable=1
        - traefik.http.routers.whatsapp_bridge_api.rule=Host(`yoururl.com.br`) ## Url da aplicação
        - traefik.http.routers.whatsapp_bridge_api.entrypoints=websecure
        - traefik.http.routers.whatsapp_bridge_api.priority=1
        - traefik.http.routers.whatsapp_bridge_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.whatsapp_bridge_api.service=whatsapp_bridge_api
        - traefik.http.services.whatsapp_bridge_api.loadbalancer.server.port=3000
        - traefik.http.services.whatsapp_bridge_api.loadbalancer.passHostHeader=true

volumes:
  whatsapp_bridge_postgres_data:
    external: true
    name: whatsapp_bridge_postgres_data

networks:
  network_public:
    name: network_public
    external: true
